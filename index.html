<!DOCTYPE html>
<html>

<head>
    <title>Charts Project</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }

        .chart-box {
            width: 700px;
            margin-bottom: 50px;
        }
    </style>
</head>

<body>

    <h1>Sales Dashboard</h1>

    <div class="chart-box">
        <h2>Bar Chart</h2>
        <canvas id="barChart"></canvas>
    </div>

    <div class="chart-box">
        <h2>Line Chart</h2>
        <canvas id="lineChart"></canvas>
    </div>

    <div class="chart-box">
        <h2>Pie Chart</h2>
        <canvas id="pieChart"></canvas>
    </div>

    <script>

        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun"];
        const sales = [12000, 15000, 10000, 18000, 22000, 20000];


        // BAR CHART
        new Chart(document.getElementById("barChart"), {
            type: "bar",

            data: {
                labels: months,

                datasets: [{
                    label: "Sales",
                    data: sales
                }]
            },

            options: {
                responsive: true
            }
        });


        // LINE CHART
        new Chart(document.getElementById("lineChart"), {
            type: "line",

            data: {
                labels: months,

                datasets: [{
                    label: "Sales Trend",
                    data: sales,
                    tension: 0.3
                }]
            },

            options: {
                responsive: true
            }
        });


        // PIE CHART
        new Chart(
            document.getElementById("pieChart"),
            {
                type: "pie",

                data: {
                    labels: [
                        "Electronics",
                        "Clothing",
                        "Food",
                        "Books"
                    ],

                    datasets: [
                        {
                            data: [40, 25, 20, 15]
                        }
                    ]
                },

                options: {
                    responsive: true
                }
            }
        );
    </script>

</body>

</html>
